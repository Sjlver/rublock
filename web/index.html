<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Generate, solve, and print Doplo logic puzzles." />
    <title>Doplo Puzzle Generator</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Link previews. Crawlers need absolute URLs; og:url is omitted so that
         shared puzzle links (?p=…) aren't collapsed onto the home page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="rublock" />
    <meta property="og:title" content="rublock — Doplo logic puzzles" />
    <meta
      property="og:description"
      content="Free, ad-free Doplo logic puzzles. Play in your browser, create your own, or print a booklet."
    />
    <meta property="og:image" content="https://dev.purpureus.net/rublock/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The rublock logo next to a partly solved Doplo puzzle grid."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
